<!--
  TO-DO: está metido como HTML plano, hay que añadir lógica de componentes
  - Añadir clase al LI que esté activo: 'nav-item--page-active' al element 'LI' del menú
  - Para inhabilitar botones: Añadir clase al LI que esté activo: 'nav-item--disabled' al element 'LI' del menú
  - La lógica de Toggles. Sólo existe un menú con dropdown, pero si se añadieran más de un dropdown esto no funciona, es para versión V01 de maquetación
  - He usado <button> (para dropdowns) y <a> (para links) pero si podría usar siempre con <a> haciendo el preventDefault
  - No pongo traducciones a los submenú ya que es creado por el usuario, idem para los SVGs
-->

<div>
    <nav class="navbar">
      <ul class="navbar__nav">
        <li
          class="nav-item dropdown"
          *ngFor="let item of arrayOfElements"
          [ngClass]="{
            'nav-item--disabled': item.disabled,
            'nav-item--page-active': idMenu === item.id
          }"
        >
          <a
            class="nav-item__link"
            *ngIf="!item.childs"
            (click)="toggleClass = false; navTo(item.url)"
          >
            <svg class="icon-menu">
              <use [attr.xlink:href]="item.icon"></use>
            </svg>
            <span class="hovered">
              <span>{{ item.label }}</span>
            </span>
          </a>
          <button
            *ngIf="item.childs"
            class="nav-item__link dropdown__toggle"
            type="button"
            (click)="toggleClass = !toggleClass; navTo(item.url)"
            [ngClass]="{ 'dropdown__toggle--active': toggleClass }"
          >
            <svg class="icon-menu">
              <use [attr.xlink:href]="item.icon"></use>
            </svg>
            <span class="hovered">
              <span>{{ item.label }}</span>
            </span>
          </button>
          <ul *ngIf="item.childs" class="nav-item__menu dropdown__menu">
            <li class="nav-item" *ngFor="let child of item.childs">
              <a
                *ngIf="child.icon === '#icon-plus-red'"
                class="nav-item__link dropdown__toggle"
                (click)="navTo(child.url)"
              >
                <svg class="icon-menu">
                  <use [attr.xlink:href]="child.icon"></use>
                </svg>
                <span class="hovered">
                  <span> {{ child.label }} </span>
                </span>
              </a>
              <a
                *ngIf="child.icon !== '#icon-plus-red'"
                [ngClass]="{ active: child.active }"
                class="nav-item__link dropdown__toggle"
                (click)="navToChild(child.id)"
              >
                <img [src]="child.icon" alt="" class="icon-menu" />
                <span class="hovered tooltip">
                  <!-- <span> {{ child.label }} </span> -->
                  <h1 class="tooltip__title">{{ child.label }}</h1>
                  <p (click)="tooltipOptionSelect('desencadenante', child.id)">
                    {{ 'MAIN_MENU.TRIGGERS' | translate }}
                  </p>
                  <p (click)="tooltipOptionSelect('aviso', child.id)">
                    {{ 'MAIN_MENU.WARNING_MESSAGE' | translate }}
                  </p>
                  <p (click)="tooltipOptionSelect('servicios', child.id)">
                    {{ 'MAIN_MENU.SERVICES' | translate }}
                  </p>
                </span>
              </a>
            </li>
          </ul>
        </li>
      </ul>
    </nav>
  </div>
