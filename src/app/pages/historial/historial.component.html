<div class="container">
  <div class="label">{{ "HISTORIAL.TITULO" | translate }}</div>
  <div class="form-wrap" *ngIf="rol === 1 || rol === 2">
    <form class="form" action="" [formGroup]="form">
      <div class="user-list">
        <div class="form-column">
          <textarea type="text" formControlName="comentarios"></textarea>
        </div>
      </div>
    </form>
    <app-button-base
      (click)="postHistorial()"
      label="{{'CONTACTO.ENVIAR' | translate }}"
    ></app-button-base>
    <div class="divider"></div>
  </div>
  <div class="list">
    <div class="list-header">
      <div class="label"> {{ "HISTORIAL.TITULO" | translate }}</div>
      <div class="label"> {{ "HISTORIAL.TITULO" | translate }}</div>
    </div>
    <div class="list-body">
      <div class="list-row" *ngFor="let item of historialClinico">
        <div class="list-fecha">{{item.fecha}}</div>
        <div class="list-comentario">{{item.comentarios}}</div>
      </div>
    </div>
  </div>

</div>
