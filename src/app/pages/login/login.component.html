<main class="login">
  <section class="login__card">
    <p class="login__eyebrow">{{ 'LOGIN.EYEBROW' | translate }}</p>
    <h1>{{ 'LOGIN.INICIAR_SESION' | translate }}</h1>
    <p class="login__intro">{{ 'LOGIN.DESCRIPCION' | translate }}</p>

    <form class="login__form" [formGroup]="form" (ngSubmit)="login()">
      <div class="login__field">
        <label for="login-dni">{{ 'CONTACTO.DNI' | translate }}</label>
        <input id="login-dni" type="text" formControlName="dni" autocomplete="username"
          [attr.aria-invalid]="getTouchedAndError('dni') ? 'true' : null" />
        <p class="login__error" *ngIf="getTouchedAndError('dni')">{{ 'ERRORS_MENSAJE.REQUIRED' | translate }}</p>
      </div>
      <div class="login__field">
        <label for="login-password">{{ 'LOGIN.PASSWORD_LABEL' | translate }}</label>
        <div class="login__password">
          <input id="login-password" [type]="isHidden ? 'text' : 'password'" formControlName="password"
            autocomplete="current-password" [attr.aria-invalid]="getTouchedAndError('password') ? 'true' : null" />
          <button type="button" class="login__toggle" (click)="isHidden = !isHidden"
            [attr.aria-label]="(isHidden ? 'LOGIN.OCULTAR' : 'LOGIN.MOSTRAR') | translate">
            {{ (isHidden ? 'LOGIN.OCULTAR' : 'LOGIN.MOSTRAR') | translate }}
          </button>
        </div>
        <p class="login__error" *ngIf="getTouchedAndError('password')">{{ 'ERRORS_MENSAJE.REQUIRED' | translate }}</p>
      </div>
      <p class="login__error login__alert" *ngIf="loginError" role="alert">{{ 'LOGIN.POPUP_ERROR_TEXT' | translate }}</p>
      <p class="login__error login__alert" *ngIf="apiError" role="alert">{{ 'LOGIN.API_ERROR_TEXT' | translate }}</p>
      <button class="login__submit" type="submit">{{ 'LOGIN.INICIAR_SESION' | translate }}</button>
    </form>
  </section>
</main>
