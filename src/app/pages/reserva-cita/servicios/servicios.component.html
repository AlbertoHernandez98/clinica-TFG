<div class="container">
    <div class="fondo">
        <div class="wrap">
            <div class="links">
                <div class="dot"></div>
                <div class="dota"></div>
                <div class="dot"></div>
                <div class="dot"></div>
            </div>
        </div>
        <div>
            <p class="p-paso"> {{ 'RESERVA_CITA.PASO' | translate }} 2</p>
        </div>
        <div class="grid-container">
            <app-form-card [isCollapsed]="true" [isCollapsible]="true" title="{{ 'RESERVA_CITA.TITLE' | translate }}">
                <!-- <p class="label-lista">{{ 'seleccionar' | translate }}</p> -->
                <div class="grid-container__lista">
                    <div class="grid-container__lista__nombre" *ngFor="let servicio of servicios?.reportes">
                        <label for="{{servicio.nombre}}">
                            <input name="servs" type="radio" id="{{servicio.nombre}}" (click)="radioFun()" [value]='servicio.nombre'
                                [(ngModel)]="radioSelected">
                            {{servicio.nombre}}
                        </label>
                        <div class="grid-container__lista__ejemplos" *ngFor="let ejemplo of servicio.ejemplos">
                            {{ ejemplo }}
                        </div>
                    </div>
                </div>
            </app-form-card>
        </div>
    </div>
</div>
